<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>驭舟 · 地图找船</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./map.css">
</head>
<body>
  <header><div><strong data-i18n="地图找船">地图找船</strong><p data-i18n="船艇位置由发布方维护">船艇位置由发布方维护</p></div><div class="header-actions"><button id="refresh" type="button" data-i18n="刷新">刷新</button></div></header>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./vendor/uni.webview.1.5.8.js"></script>
  <script type="module" src="./map.js"></script>

</html>
